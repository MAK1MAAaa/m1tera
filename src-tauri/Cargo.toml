[package]
name = "m1tera"
version = "0.5.0"
description = "A personal agent with explicit context and permissions"
authors = ["m1tera contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "m1tera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-shell = "=2.5.0"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
